name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp build number (used by the in-app update notice)
        run: |
          BUILD="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/" index.html sw.js
          printf '{"build":"%s"}\n' "$BUILD" > version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
