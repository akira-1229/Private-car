<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="マイカー">
  <meta name="theme-color" content="#0b1220">
  <title>マイカー点検</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="title">
        <h1 id="carName">インサイト</h1>
        <p id="syncStatus" class="sub">読み込み中…</p>
      </div>
      <div class="actions">
        <button id="btnRefresh" class="icon-btn" aria-label="今すぐ更新">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button id="btnSettings" class="icon-btn" aria-label="設定">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        </button>
      </div>
    </header>

    <div id="demoBanner" class="banner" hidden>
      デモデータを表示中です。<button id="btnOpenSettings2" class="link">設定</button>からスプレッドシートを連携してください。
    </div>
    <div id="errorBanner" class="banner error" hidden></div>

    <div id="viewer" aria-label="車の3Dモデル（ドラッグで回転・タップで詳細）"></div>
    <p class="hint" id="hint">ドラッグで回転 ・ ピンチで拡大 ・ 部位をタップ</p>

    <nav class="summary" id="summary"></nav>

    <section id="panel" class="panel" aria-hidden="true">
      <div class="grabber"></div>
      <div class="panel-head">
        <div>
          <h2 id="panelTitle"></h2>
          <p id="panelSub" class="sub"></p>
        </div>
        <button id="btnClosePanel" class="icon-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </section>
  </div>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>設定</h2>
      <label>スプレッドシートの URL
        <input type="url" name="sheet" placeholder="https://docs.google.com/spreadsheets/d/…" autocomplete="off">
        <small>共有設定を「リンクを知っている全員（閲覧者）」にしたシートのURL、「ウェブに公開」したCSVのURL、またはApps ScriptのウェブアプリURLが使えます。</small>
      </label>
      <label>シート名（タブ名・任意）
        <input type="text" name="sheetName" placeholder="例: 点検管理表">
      </label>
      <label>自動更新の間隔
        <select name="interval">
          <option value="1">1分</option>
          <option value="5">5分</option>
          <option value="15">15分</option>
          <option value="30">30分</option>
          <option value="60">60分</option>
        </select>
      </label>
      <div class="row2">
        <label>車の名前
          <input type="text" name="carName" placeholder="インサイト">
        </label>
        <label>ボディカラー
          <input type="color" name="bodyColor">
        </label>
      </div>
      <div class="row3">
        <label>ナンバー（地名・分類番号）
          <input type="text" name="plateRegion" placeholder="岐阜 303">
        </label>
        <label>ひらがな
          <input type="text" name="plateKana" placeholder="—" maxlength="1">
        </label>
        <label>番号
          <input type="text" name="plateNumber" placeholder="55-10">
        </label>
      </div>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost">キャンセル</button>
        <button value="save" class="btn primary" id="btnSave">保存して読み込み</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
