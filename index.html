<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="マイカー">
  <meta name="theme-color" content="#0b1220">
  <meta name="app-build" content="__BUILD__">
  <title>マイカー点検</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=5">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="title-card" id="titleCard" aria-label="タップで今すぐ更新">
        <h1 id="carName">インサイト</h1>
        <p id="syncStatus" class="sub">読み込み中…</p>
      </button>
      <a class="locate-btn" id="btnLocate" href="findmy://items" aria-label="車の現在地（探すアプリ）">
        <span class="locate-pulse"></span>
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M21 3 3 10.53v.98l6.84 2.65L12.48 21h.98L21 3z"/></svg>
        <span class="locate-label">現在地</span>
      </a>
    </header>

    <div id="demoBanner" class="banner" hidden>
      デモデータを表示中です。<button id="btnOpenSettings2" class="link">設定</button>タブからスプレッドシートを連携してください。
    </div>
    <div id="errorBanner" class="banner error" hidden></div>
    <button id="updateBanner" class="update-banner" hidden>✨ 新しいバージョンがあります　<b>タップで更新</b></button>

    <div id="viewer" aria-label="車の3Dモデル（ドラッグで回転・タップで詳細）"></div>
    <p class="hint" id="hint">ドラッグで回転 ・ タップで記録 ・ ダブルタップでドア開閉</p>
    <div id="toast" class="toast" role="status"></div>


    <section id="panel" class="panel" aria-hidden="true">
      <div class="grabber"></div>
      <div class="panel-head">
        <div>
          <h2 id="panelTitle"></h2>
          <p id="panelSub" class="sub"></p>
        </div>
        <div class="head-btns">
        <button id="btnAdd" class="icon-btn add-btn" aria-label="記録を追加" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
        <button id="btnClosePanel" class="icon-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        </div>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </section>
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="vehicle">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.92 6.01A1.5 1.5 0 0 0 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm11 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM5 11l1.5-4.5h11L19 11H5z"/></svg>
        <span>車両情報</span>
      </button>
      <button class="tab" data-tab="maint">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
        <span>点検整備</span>
      </button>
      <button class="tab" data-tab="wash">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.7S6 9.5 6 13.5a6 6 0 0 0 12 0C18 9.5 12 2.7 12 2.7zm0 16.8a4 4 0 0 1-4-4c0-.5.1-1 .3-1.5.4 1.9 2 3.3 3.9 3.5h.3a.75.75 0 0 1 0 1.5c-.2.3-.3.5-.5.5zM19.5 2l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7zM4.5 3l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5z"/></svg>
        <span>洗車清掃</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        <span>設定</span>
      </button>
    </nav>
    <div id="docViewer" class="doc-viewer" hidden>
      <button class="icon-btn doc-close" id="docClose" aria-label="閉じる">✕</button>
      <img id="docImg" alt="">
    </div>
  </div>


  <script type="module" src="js/app.js"></script>
</body>
</html>
